services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewradar}
      POSTGRES_USER: ${POSTGRES_USER:-interviewradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - internal

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # 生产默认读取 .env；本地校验时可用 ENV_FILE=.env.production.example 覆盖。
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewradar}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-interviewradar}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY in .env}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      # The only peer allowed to supply forwarded headers is the Nginx service
      # below. Fixed private addresses avoid trusting every bridge network.
      FORWARDED_ALLOW_IPS: "172.30.0.3"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      internal:
        ipv4_address: 172.30.0.2

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Keep the reverse-proxy address stable because the app trusts it for
    # X-Forwarded-For / X-Forwarded-Proto processing.
    networks:
      internal:
        ipv4_address: 172.30.0.3

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
